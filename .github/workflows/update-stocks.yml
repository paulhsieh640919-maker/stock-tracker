name: 更新台股收盤價

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 週一到週五 台灣時間 14:00 (UTC 06:00)
  workflow_dispatch:        # 允許手動觸發

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install requests beautifulsoup4 yfinance -q

      - name: 執行股價更新
        run: python3 update.py
        env:
          CI: 'true'

      - name: Git commit & push
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --staged --quiet && echo "無變動，略過 commit" || \
            git commit -m "更新股價 $(date -u +%Y-%m-%d)" && git push
